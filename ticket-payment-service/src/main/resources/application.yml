server:
  port: 8086

# 💡 컨슈머 그룹 ID 중앙 관리
custom:
  kafka:
    groups:
      payment: ticket-group-payment-worker # 결제 처리용 그룹
      indexer: ticket-group-es-indexer     # ES 색인용 그룹
      dlq: ticket-dlq-group                # DLQ 처리용 그룹

# OutboxRelay 폴링 주기(ms)
outbox:
  relay:
    interval-ms: 1000

spring:
  kafka:
    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    consumer:
      # 기본(Default) 그룹 ID - 필요시 커스텀 그룹 ID로 덮어씌워짐
      group-id: ${custom.kafka.groups.payment}
      auto-offset-reset: earliest

      # 1. ErrorHandlingDeserializer를 래퍼(Wrapper)로 설정
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        # 팟(인스턴스)당 컨슈머 스레드 수. 스케일아웃은 KEDA가 팟 수로 담당하므로 1이 기본값.
        custom.concurrency: ${KAFKA_CONSUMER_CONCURRENCY:1}
        # 파티션 할당 전략. 미지정 시 Kafka 기본값인 RangeAssignor(eager)가 적용되어
        # 리밸런싱 동안 모든 컨슈머가 파티션을 반납해 전체 소비가 멈춘다.
        # CooperativeSticky 는 이동이 필요한 파티션만 반납하므로 나머지는 계속 소비한다.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

        # Kafka Client Native 옵션
        max.poll.interval.ms: 15000
        max.poll.records: 50
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000

        # 2. 실제 사용할 내부 Deserializer 지정
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        # 3. JSON 역직렬화 허용 패키지 및 DTO 지정
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: org.example.dto.TicketReservationDto

      listener:
        type: batch # single(기본값) 대신 batch로 설정

    # 💡 결제 완료 후 최종 토픽 발행을 위한 고신뢰 프로듀서 설정
    producer:
      acks: all # min.insync.replicas=2
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # 헤더에 DTO 패키지/클래스 정보 포함 (Consumer가 참고하여 변환 가능)
        spring.json.add.type.headers: true
        enable.idempotence: true # 멱등성 프로듀서 활성화 (중복 전송 차단)
        max.in.flight.requests.per.connection: 5

  elasticsearch:
    uris: http://localhost:9200

  data:
    redis:
      host: localhost
      port: 6379

  # Transactional Outbox 저장소(Postgres): payment_record / outbox_event 소유
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: ticketing
    password: ticketing
  jpa:
    hibernate:
      ddl-auto: update   # 데모용. 엔티티로부터 payment_record/outbox_event 테이블 생성.
    open-in-view: false

logging:
  level:
    # 1. Config 찍히는 지저분한 내부 로그는 WARN으로 숨김
    org.apache.kafka.clients.producer.ProducerConfig: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN
    org.apache.kafka.clients.admin.AdminClientConfig: WARN

    # 2. ⚡ 리밸런싱 및 파티션 할당 과정 로그 상세 확인
    org.apache.kafka.clients.consumer.internals.ConsumerCoordinator: INFO
    org.springframework.kafka.listener.KafkaMessageListenerContainer: INFO
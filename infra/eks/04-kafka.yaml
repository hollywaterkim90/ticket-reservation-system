# 2단계 Kafka 본체 — 브로커 1대 + 토픽 생성 Job.
# 원본: infra/infra.yaml 의 kafka-1(163줄~) + init-kafka-topics(428줄~). 원본은 3대 전제라 1대로 고친다(로드맵 수정 3-1).
# 볼륨(PVC kafka-1-data)은 03-kafka-storage.yaml — 먼저 apply 되어 있어야 한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-1
spec:
  replicas: 1
  strategy:
    type: Recreate   # 기본 RollingUpdate 는 옛 팟이 살아 있는 채로 새 팟을 띄운다.
                     # 같은 로그 디렉터리를 두 브로커가 열 수 없어(.lock 충돌) 새 팟이 CrashLoopBackOff 로 멈춘다.
                     # EKS 는 한 가지 더 — EBS 볼륨은 ReadWriteOnce 라 옛 팟이 놓기 전엔 새 팟에 붙지도 않는다.
  selector:
    matchLabels:
      app: kafka-1
  template:
    metadata:
      labels:
        app: kafka-1
    spec:
      securityContext:
        fsGroup: 1000             # cp-kafka 는 appuser(uid/gid 1000)로 돈다. 새 EBS 볼륨 루트는 root 소유라
                                  # 안 주면 meta.properties 쓰기에서 Permission denied(이슈 #42 재발) → CrashLoopBackOff
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.7.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "INTERNAL://kafka-1-service:9092"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@kafka-1-service:29093"  # 노드ID@호스트:컨트롤러포트. 3명 그대로면 2·3번이 없어 과반(2/3) 선출이 안 돼 컨트롤러가 안 뜬다
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "INTERNAL"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: CLUSTER_ID
          value: "MkU3OEVBNTcwNTJENDM2Qk"
        - name: KAFKA_LOG_DIRS
          value: "/var/lib/kafka/data/logs"   # 볼륨 루트가 아닌 하위 폴더 — EBS(ext4) 루트의 lost+found 를 Kafka 가 파티션으로 오인하지 않게
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"                       # 3이면 브로커 1대로는 복제본 3개를 못 만들어 __consumer_offsets 생성 실패 → 컨슈머가 오프셋 커밋을 못 한다
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: "1"                       # 2면 동기화된 복제본이 1개뿐이라 acks=all 쓰기가 NotEnoughReplicas 로 거부된다
                                           # (예매는 acks=1 이라 영향 없지만, 결제는 acks=all — 올리면 바로 막힌다)
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
        - name: KAFKA_HEAP_OPTS
          value: "-Xms256m -Xmx256m"
        resources:
          requests:
            cpu: 250m                     # 0.25코어 — 실습 저부하. apply 후 kubectl top 으로 실측해 고친다(로드맵 1-1)
            memory: 512Mi                 # 힙 256MB × 2 — 메타스페이스·스레드 스택·네트워크 버퍼 등 힙 밖 메모리 몫
                                          # 2단계 합계 850m/1792Mi → t3.medium 1대 allocatable(≈1.9코어/3.5Gi)의 절반
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data  # 이미지 기본 데이터 경로(이슈 #42). 로그는 그 아래 logs/ 에 쌓인다
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kafka-1-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-1-service   # 예매 서비스가 이 이름으로 접속한다(02-reservation.yaml 에 추가 예정)
spec:
  ports:
  - port: 9092
    name: internal
  - port: 29093
    name: controller
  selector:
    app: kafka-1
---
# 토픽 생성 Job — 자동 생성(AUTO_CREATE_TOPICS)을 꺼 두었으므로 토픽은 여기서 만든다.
apiVersion: batch/v1
kind: Job
metadata:
  name: init-kafka-topics
spec:
  template:
    spec:
      containers:
      - name: init-kafka
        image: confluentinc/cp-kafka:7.7.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          echo "⏳ Waiting for Kafka broker to be ready..."
          # 원본은 3대를 && 로 기다렸다 — 그대로면 없는 2·3번을 영원히 기다려 토픽이 안 생긴다
          until nc -z kafka-1-service 9092; do
            echo "Kafka broker is not ready yet. Retrying in 2 seconds..."
            sleep 2
          done

          echo "🚀 Creating kafka topics..."
          BOOTSTRAP_SERVERS="kafka-1-service:9092"

          # RF 1 — 3이면 브로커 1대로는 복제본 3개를 못 놓아 토픽 생성 실패(InvalidReplicationFactor)
          # 파티션 3은 유지 — 파티션 수는 브로커 수가 아니라 컨슈머 병렬도(KAFKA_CONSUMER_CONCURRENCY)와 맞춘다
          kafka-topics --bootstrap-server $BOOTSTRAP_SERVERS --create --if-not-exists --topic ticket-reservations --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server $BOOTSTRAP_SERVERS --create --if-not-exists --topic ticket-payments --partitions 3 --replication-factor 1
          kafka-topics --bootstrap-server $BOOTSTRAP_SERVERS --create --if-not-exists --topic ticket-reservations.DLQ --partitions 3 --replication-factor 1

          echo "✅ Successfully created topics:"
          kafka-topics --bootstrap-server $BOOTSTRAP_SERVERS --list
      restartPolicy: OnFailure
  backoffLimit: 4

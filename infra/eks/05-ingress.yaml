# 수정 4-④ (#60) — 외부 입구 = ALB 하나. LB Controller 가 이 Ingress 를 보고 ALB 를 만든다.
# L7 이라 URL 경로를 본다: /reserve 만 앱으로, 나머지는 ALB 가 직접 404 (앱은 요청을 보지도 못한다).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-reservation
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing" # 퍼블릭 서브넷(앞단)에. 기본값 internal 이면 프라이빗에 생겨 맥에서 안 닿는다
    alb.ingress.kubernetes.io/target-type: "ip" # 파드 IP 를 대상으로 — 헬스체크가 노드가 아닌 파드를 직접 본다(기본값 instance)
    # 헬스체크: ALB 가 주기적으로 GET / 를 보내고, 앱의 응답 코드가 success-codes 목록에 있으면 "정상"으로 판단한다.
    #   - 우리 앱엔 / 경로가 없다 → 앱이 살아 있어도 GET / 에는 항상 404 로 응답한다.
    #   - 기본값 "200" 만 두면 → 404 는 목록에 없음 → 살아 있는 파드를 "비정상"으로 판단한다.
    #   - 그래서 404 를 목록에 추가 → "404 라도 응답만 하면 살아 있다"로 판단한다. (앱의 응답이 바뀌는 게 아니라 ALB 의 기준이 바뀐다)
    #   한계: 응답만 하면 통과라 앱 내부 고장은 못 잡는다. 제대로 하려면 actuator 의 /actuator/health 로 헬스체크.
    alb.ingress.kubernetes.io/success-codes: "200,404"
spec:
  ingressClassName: alb # LB Controller 담당 표시 — 차트가 기본으로 만드는 IngressClass(③ 의 loadBalancerClass 와 같은 역할)
  rules:
  - http:
      paths:
      - path: /reserve
        pathType: Exact
        backend:
          service:
            name: ticket-reservation-service
            port:
              number: 8085

# KEDA operator 는 keda 네임스페이스에서 실행되는데,
# Kafka 브로커가 advertised.listeners 로 짧은 이름(kafka-N-service)을 반환한다.
# keda 네임스페이스에서는 그 짧은 이름이 해석되지 않으므로,
# 동일 이름의 ExternalName 서비스를 만들어 default 의 실제 브로커로 별칭 연결한다.
apiVersion: v1
kind: Service
metadata:
  name: kafka-1-service
  namespace: keda
spec:
  type: ExternalName
  externalName: kafka-1-service.default.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-2-service
  namespace: keda
spec:
  type: ExternalName
  externalName: kafka-2-service.default.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-3-service
  namespace: keda
spec:
  type: ExternalName
  externalName: kafka-3-service.default.svc.cluster.local

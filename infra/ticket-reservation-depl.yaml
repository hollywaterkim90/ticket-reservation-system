apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-reservation-service
  labels:
    app: ticket-reservation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-reservation-service
  template:
    metadata:
      labels:
        app: ticket-reservation-service
    spec:
      containers:
      - name: ticket-reservation-service
        image: ticket-reservation-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080 # 컨테이너/팟으로 격리되므로 내부는 8080 통일 (외부는 Service 가 8085 로 노출)

        # 🛠️ 쿠버네티스 내부 카프카/레디스/ES 주소를 환경변수로 주입 (Spring Boot Relaxed Binding)
        env:
        # application.yml 의 server.port(8085) 를 8080 으로 오버라이드
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-1-service:9092,kafka-2-service:9092,kafka-3-service:9092"
        # spring.data.redis.* (Boot 3.x)
        - name: SPRING_DATA_REDIS_HOST
          value: "local-redis"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        # spring.elasticsearch.uris (data-elasticsearch 의존성 autoconfig 대비)
        - name: SPRING_ELASTICSEARCH_URIS
          value: "http://local-elasticsearch:9200"

        # actuator 미포함 → TCP 소켓으로 기동 체크
        startupProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-reservation-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: ticket-reservation-service
  ports:
    - port: 8085        # 외부/클러스터에 노출되는 포트 (부하 스크립트가 사용)
      targetPort: 8080  # 컨테이너(앱)의 실제 리슨 포트
      nodePort: 30085

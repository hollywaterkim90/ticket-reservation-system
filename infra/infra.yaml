        - name: ELASTICSEARCH_HOSTS
          value: "http://local-elasticsearch:9200"
---
apiVersion: v1
kind: Service
metadata:
  name: local-kibana
spec:
  type: NodePort
  ports:
  - port: 5601
    targetPort: 5601
    nodePort: 30002
  selector:
    app: local-kibana

---
# --- 5. Kafka Broker 1 (kafka-1) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-1
spec:
  replicas: 1
  strategy:
    type: Recreate   # 기본 RollingUpdate 는 옛 팟이 살아 있는 채로 새 팟을 띄운다.
                     # 같은 로그 디렉터리를 두 브로커가 열 수 없어(.lock 충돌) 새 팟이 CrashLoopBackOff 로 멈춘다.
  selector:
    matchLabels:
      app: kafka-1
  template:
    metadata:
      labels:
        app: kafka-1
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.7.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "INTERNAL://kafka-1-service:9092"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@kafka-1-service:29093,2@kafka-2-service:29093,3@kafka-3-service:29093"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "INTERNAL"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: CLUSTER_ID
          value: "MkU3OEVBNTcwNTJENDM2Qk"
        - name: KAFKA_LOG_DIRS
          value: "/tmp/kraft-combined-logs"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "3"
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: "2"
        - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
          value: "false"
        - name: KAFKA_HEAP_OPTS
          value: "-Xms256m -Xmx256m"
        volumeMounts:
        - name: data
          mountPath: /tmp/kraft-combined-logs
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kafka-1-data
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-1-service
spec:
  ports:
  - port: 9092
    name: internal
  - port: 29093
    name: controller
  selector:
    app: kafka-1

---

# --- 1. Redis (local-redis) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-redis
  template:
    metadata:
      labels:
        app: local-redis
    spec:
      containers:
      - name: redis
        image: redis:7.2-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: local-redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: local-redis

---
# --- 2. Redis Insight (redis-insight) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-insight
  template:
    metadata:
      labels:
        app: redis-insight
    spec:
      containers:
      - name: redis-insight
        image: redis/redisinsight:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5540
        env:
        - name: RI_APP_PORT
          value: "5540"
        - name: REDIS_CONNECTIONS
          value: "local-redis:local-redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-insight
spec:
  type: NodePort
  ports:
  - port: 8001
    targetPort: 5540
    nodePort: 30001
  selector:
    app: redis-insight

---
# --- 3. Elasticsearch (local-elasticsearch) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-elasticsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-elasticsearch
  template:
    metadata:
      labels:
        app: local-elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9200
        - containerPort: 9300
        env:
        - name: discovery.type
          value: "single-node"
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
---
apiVersion: v1
kind: Service
metadata:
  name: local-elasticsearch
spec:
  ports:
  - name: http
    port: 9200
    targetPort: 9200
  - name: transport
    port: 9300
    targetPort: 9300
  selector:
    app: local-elasticsearch

---
# --- 4. Kibana (local-kibana) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-kibana
  template:
    metadata:
      labels:
        app: local-kibana
    spec:
      containers:
      - name: kibana
        image: docker.elastic.co/kibana/kibana:8.13.4

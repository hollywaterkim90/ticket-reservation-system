metadata:
  name: kafka-ui
spec:
  type: NodePort
  ports:
  - port: 8090
    targetPort: 8080
    nodePort: 30003
  selector:
    app: kafka-ui
---
# --- 9. 자동 토픽 생성기 (init-kafka) ---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-kafka-topics
spec:
  template:
    spec:
      containers:
      - name: init-kafka
        image: confluentinc/cp-kafka:7.7.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          echo "⏳ Waiting for Kafka brokers to be ready..."
          until nc -z kafka-1-service 9092 && nc -z kafka-2-service 9092 && nc -z kafka-3-service 9092; do
            echo "Kafka brokers are not ready yet. Retrying in 2 seconds..."
            sleep 2
          done
          
          echo "🚀 Creating kafka topics..."
          BOOTSTRAP_SERVERS="kafka-1-service:9092,kafka-2-service:9092,kafka-3-service:9092"

          kafka-topics --bootstrap-server $BOOTSTRAP_SERVERS --create --if-not-exists --topic ticket-reservations --partitions 3 --replication-factor 3
          kafka-topics --bootstrap-server $BOOTSTRAP_SERVERS --create --if-not-exists --topic ticket-payments --partitions 3 --replication-factor 3
          kafka-topics --bootstrap-server $BOOTSTRAP_SERVERS --create --if-not-exists --topic ticket-reservations.DLQ --partitions 3 --replication-factor 3
          
          echo "✅ Successfully created topics:"
          kafka-topics --bootstrap-server $BOOTSTRAP_SERVERS --list
      restartPolicy: OnFailure
  backoffLimit: 4

---
# --- 10. PostgreSQL (local-postgres) — Transactional Outbox 저장소 ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # 단일 DB 팟이라 무중단으로 얻을 것이 없다.
                     # 두 팟이 같은 데이터 디렉터리를 열면 postmaster.pid 충돌로 새 팟이 기동에 실패한다.
  selector:
    matchLabels:
      app: local-postgres
  template:
    metadata:
      labels:
        app: local-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "ticketing"
        - name: POSTGRES_USER
          value: "ticketing"
        - name: POSTGRES_PASSWORD
          value: "ticketing"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: local-postgres
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: local-postgres
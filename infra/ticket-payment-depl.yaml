apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-payments-service
  labels:
    app: ticket-payments-service
spec:
  replicas: 1 # 기본 1대로 시작 (부하가 오면 KEDA가 3대까지 늘려줌)
  selector:
    matchLabels:
      app: ticket-payments-service
  template:
    metadata:
      labels:
        app: ticket-payments-service
    spec:
      containers:
      - name: ticket-payments-service
        image: ticket-payments-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080 # 컨테이너/팟으로 격리되므로 관례적인 8080 사용

        # 🛠️ 쿠버네티스 내부 카프카/레디스/ES 주소를 환경변수로 주입 (Spring Boot Relaxed Binding)
        env:
        # application.yml 의 server.port(8086) 를 8080 으로 오버라이드
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-1-service:9092,kafka-2-service:9092,kafka-3-service:9092"
        # spring.data.redis.* 에 바인딩 (Boot 3.x)
        - name: SPRING_DATA_REDIS_HOST
          value: "local-redis"
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
        # Transactional Outbox 저장소(Postgres): payment_record / outbox_event
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://local-postgres:5432/ticketing"
        - name: SPRING_DATASOURCE_USERNAME
          value: "ticketing"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "ticketing"
        # spring.elasticsearch.uris
        - name: SPRING_ELASTICSEARCH_URIS
          value: "http://local-elasticsearch:9200"
        # KafkaConfig 의 custom.concurrency = 팟당 컨슈머 스레드 수.
        # 1로 두어야 팟 1개 = active consumer 1개. 스케일아웃은 KEDA 가 팟 수(1→3)로 담당한다.
        # 토픽의 파티션 수(3)와는 다른 값이므로 혼동 주의.
        - name: KAFKA_CONSUMER_CONCURRENCY
          value: "1"

        # 앱이 뜰 때까지 여유있게 대기 (actuator 미포함 → TCP 소켓으로 체크)
        startupProbe:
          tcpSocket:
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-payments-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: ticket-payments-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

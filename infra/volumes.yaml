# =====================================================================
# 영속 볼륨 (PVC)
#   infra.yaml 에서 일부러 분리했다. 같은 파일에 두면
#   `kubectl delete -f infra/infra.yaml` 한 번에 데이터까지 사라져
#   볼륨을 붙인 의미가 없어진다.
#
#   팟만 정리:   kubectl delete -f infra/infra.yaml
#   데이터까지:  kubectl delete -f infra/volumes.yaml
# =====================================================================
---
# kafka-1 로그 볼륨 — 브로커마다 로그가 분리되므로 PVC 도 브로커당 하나.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-1-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# kafka-2 로그 볼륨 — 브로커마다 로그가 분리되므로 PVC 도 브로커당 하나.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-2-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# kafka-3 로그 볼륨 — 브로커마다 로그가 분리되므로 PVC 도 브로커당 하나.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-3-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Outbox 저장소 볼륨 — 유실을 막으려 넣은 Outbox 가 휘발성 저장소 위에 있으면 의미가 없다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

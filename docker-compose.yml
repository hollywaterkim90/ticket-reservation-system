version: '3.8'

# docker compose up -d kafka-1 kafka-2 kafka-3
# docker compose up -d local-elasticsearch local-kibana local-redis redis-insight kafka-ui
# docker compose up -d flink-jobmanager flink-taskmanager   # UI http://localhost:8081

services:
  # --- Kafka Broker 1 ---
  kafka-1:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    container_name: kafka-1
    ports:
      - "9092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-1:9092,EXTERNAL://localhost:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'   # 이미지 기본 데이터 경로(appuser 소유). /tmp/... 는 이미지에 없는 경로라 볼륨이 root 소유로 생겨 권한 거부된다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  # --- Kafka Broker 2 ---
  kafka-2:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    container_name: kafka-2
    ports:
      - "9093:19093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19093,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-2:9092,EXTERNAL://localhost:9093'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'   # 이미지 기본 데이터 경로(appuser 소유). /tmp/... 는 이미지에 없는 경로라 볼륨이 root 소유로 생겨 권한 거부된다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  # --- Kafka Broker 3 ---
  kafka-3:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    container_name: kafka-3
    ports:
      - "9094:19094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19094,CONTROLLER://0.0.0.0:29093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka-3:9092,EXTERNAL://localhost:9094'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'   # 이미지 기본 데이터 경로(appuser 소유). /tmp/... 는 이미지에 없는 경로라 볼륨이 root 소유로 생겨 권한 거부된다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # 🚀 토픽 자동 생성을 위한 Init 컨테이너
  init-kafka:
    image: confluentinc/cp-kafka:${KAFKA_VERSION}
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    command:
      - /bin/sh
      - -c
      - |
        echo "⏳ Waiting for Kafka brokers to be ready..."
        until kafka-topics --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --list > /dev/null 2>&1; do
          echo "Kafka is not ready yet... sleeping 2s"
          sleep 2
        done
        echo "🚀 Creating kafka topics..."
        kafka-topics --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic ticket-reservations --partitions ${KAFKA_TOPIC_PARTITIONS} --replication-factor 3
        kafka-topics --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic ticket-payments --partitions ${KAFKA_TOPIC_PARTITIONS} --replication-factor 3
        kafka-topics --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --create --if-not-exists --topic ticket-reservations.DLQ --partitions ${KAFKA_TOPIC_PARTITIONS} --replication-factor 3
        echo "✅ Successfully created topics:"
        kafka-topics --bootstrap-server kafka-1:9092,kafka-2:9092,kafka-3:9092 --list

  # kafka ui
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  # 2. 엘라스틱서치 (검색/저장 엔진)
  local-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION}
    container_name: local-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

  # 3. 키바나 (시각화 툴)
  local-kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTICSEARCH_VERSION}
    container_name: local-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://local-elasticsearch:9200
    depends_on:
      - local-elasticsearch

  # 4. 레디스 (고속 중복 체크용 캐시)
  local-redis:
    image: redis:7.2-alpine
    container_name: local-redis
    ports:
      - "6379:6379"

  # 5. 레디스 인사이트 (Redis 공식 웹 GUI 관리 툴 - v2 최신 규격 반영)
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "8001:5540" # 💡 최신 이미지의 내부 기본 포트는 5540입니다.
    environment:
      - RI_APP_PORT=5540
      # 자동 연결을 지원하는 최신 환경 변수 포맷입니다.
      - REDIS_CONNECTIONS=local-redis:local-redis:6379
    depends_on:
      - local-redis

  # --- Flink JobManager (잡 접수·조율 + 웹 UI 8081) ---
  flink-jobmanager:
    image: flink:1.20
    container_name: flink-jobmanager
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      # 공식 이미지는 이 값을 flink-conf 에 합쳐 넣는다. TaskManager 가 붙을 주소.
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    volumes:
      # 이미지에 카프카 커넥터가 없다. lib 디렉터리 통째로 마운트하면 기존 라이브러리가 가려지므로 파일 하나만 얹는다.
      - ./flink/lib/flink-sql-connector-kafka.jar:/opt/flink/lib/flink-sql-connector-kafka.jar
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  # --- Flink TaskManager (실제 연산. 슬롯 = 병렬 실행 단위) ---
  flink-taskmanager:
    image: flink:1.20
    container_name: flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 3
    volumes:
      - ./flink/lib/flink-sql-connector-kafka.jar:/opt/flink/lib/flink-sql-connector-kafka.jar
    depends_on:
      - flink-jobmanager

# 브로커 로그를 컨테이너 재생성 후에도 보존한다. 없으면 재시작 시 토픽이 전부 사라진다.
volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
